# Secrets used (environment "release"):
#   KEYSTORE_BASE64   - release keystore file, base64-encoded (base64 -i dojazd-release.p12)
#   KEYSTORE_PASSWORD - keystore password
#   KEY_ALIAS         - key alias in the keystore
#   KEY_PASSWORD      - key password (same as KEYSTORE_PASSWORD for PKCS12)

name: Release

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]

permissions: {}

env:
  TAG: ${{ github.ref_name }}

jobs:
  build_unsigned:
    name: Build Unsigned
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-disabled: true

      - name: Build
        run: ./gradlew --no-build-cache build :androidApp:assembleRelease -PappVersionName="${TAG#v}"

      - name: Upload unsigned
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: unsigned
          path: androidApp/build/outputs/apk/release/androidApp-release-unsigned.apk
          if-no-files-found: error
          retention-days: 3

  sign:
    name: Sign Package
    needs: build_unsigned
    runs-on: ubuntu-24.04
    environment: release
    permissions: {}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: unsigned

      - name: Sign package
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "build-tools;36.0.0" > /dev/null
          key_store="$RUNNER_TEMP/release.jks"
          trap 'rm -f "$key_store"' EXIT
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$key_store"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" sign \
            --ks "$key_store" --ks-pass env:KEYSTORE_PASSWORD \
            --ks-key-alias "$KEY_ALIAS" --key-pass env:KEY_PASSWORD \
            --v1-signing-enabled false --v2-signing-enabled true \
            --v3-signing-enabled true --v4-signing-enabled false \
            --alignment-preserved true \
            --out "dojazd-${TAG#v}.apk" androidApp-release-unsigned.apk

      - name: Upload signed
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: signed
          path: dojazd-*.apk
          if-no-files-found: error
          retention-days: 3

  publish_release:
    name: Publish Release
    needs: sign
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: signed

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" dojazd-*.apk --clobber
          else
            gh release create "$TAG" dojazd-*.apk --verify-tag --title "$TAG" --generate-notes
          fi
