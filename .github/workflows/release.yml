name: Release

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]

permissions:
  contents: read

env:
  TAG: ${{ github.ref_name }}

# Every action is named by the commit it was at when added, with the version beside it: a tag can be
# moved to other code, a commit cannot. Update both together.
jobs:
  # Built twice, on separate runners and without the key, so that the two can be compared below.
  # Nothing here can reach the signing key: no secret is passed to Gradle, its plugins or the tests.
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        copy: [first, second]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6
        with:
          cache-disabled: true

      # The first copy also runs the tests, the formatting check and lint; the second only has to match it.
      - name: Build
        run: |
          checks=""
          if [ "${{ matrix.copy }}" = "first" ]; then checks="build"; fi
          ./gradlew --no-build-cache $checks :androidApp:assembleRelease -PappVersionName="${TAG#v}"

      - name: Record the toolchain
        run: |
          {
            echo "- JDK: $(java -version 2>&1 | head -n 2 | tail -n 1)"
            echo "- Gradle: $(./gradlew --version | sed -n 's/^Gradle //p')"
          } > androidApp/build/outputs/apk/release/toolchain.md

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: unsigned-${{ matrix.copy }}
          path: |
            androidApp/build/outputs/apk/release/androidApp-release-unsigned.apk
            androidApp/build/outputs/apk/release/toolchain.md
          if-no-files-found: error
          retention-days: 3

  # The only job that sees the key, and it runs nothing but the SDK's own signing tool on a finished APK.
  # Put the four secrets in an environment named "release" with required reviewers, and a pushed tag
  # cannot use the key until someone approves it.
  sign:
    needs: build
    runs-on: ubuntu-latest
    environment: release
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: unsigned-first

      - name: Sign
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          for name in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::The secret $name is not set; refusing to publish an unsigned APK."
              exit 1
            fi
          done
          trap 'rm -f "$RUNNER_TEMP/release.jks"' EXIT
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          apksigner="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n 1)/apksigner"
          "$apksigner" sign \
            --ks "$RUNNER_TEMP/release.jks" \
            --ks-pass env:KEYSTORE_PASSWORD \
            --ks-key-alias "$KEY_ALIAS" \
            --key-pass env:KEY_PASSWORD \
            --out androidApp-release.apk \
            androidApp-release-unsigned.apk

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: signed
          path: androidApp-release.apk
          if-no-files-found: error
          retention-days: 3

  # Checks, with no permission to publish anything, that the signed APK is the second build plus a signature.
  verify:
    needs: sign
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4

      - name: Check that the build is reproducible
        run: |
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install --quiet --require-hashes -r tools/release/requirements.txt
          # apksigcopier calls apksigner by name, and the runner does not have it on the PATH.
          apksigner="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n 1)/apksigner"
          "$RUNNER_TEMP/venv/bin/apksigcopier" compare signed/androidApp-release.apk \
            --unsigned unsigned-second/androidApp-release-unsigned.apk \
            --verify-cmd "$apksigner verify"
          echo "The signed APK is identical to the one built on another runner, apart from the signature."

  publish:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4

      - name: Prepare the release files
        run: |
          apk="dojazd-${TAG#v}.apk"
          cp signed/androidApp-release.apk "$apk"
          sha256sum "$apk" > "$apk.sha256"
          echo "APK=$apk" >> "$GITHUB_ENV"

          apksigner="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n 1)/apksigner"
          digest="$("$apksigner" verify --print-certs "$apk" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p')"
          if [ -z "$digest" ]; then
            echo "::error::Could not read the signing certificate of $apk."
            exit 1
          fi
          fingerprint="$(echo "$digest" | tr 'a-f' 'A-F' | sed 's/../&:/g; s/:$//')"

          {
            echo "## Verify"
            echo
            echo "Signing certificate (SHA-256), to check with [AppVerifier](https://github.com/soupslurpr/AppVerifier) on the phone:"
            echo
            echo '```text'
            echo "app.dojazd"
            echo "$fingerprint"
            echo '```'
            echo
            echo "This APK is a reproducible build of \`$TAG\`. Built with:"
            echo
            cat unsigned-first/toolchain.md
            echo
            echo "To check it yourself:"
            echo
            echo '```sh'
            echo "git checkout $TAG"
            echo "./gradlew --no-build-cache :androidApp:assembleRelease -PappVersionName=${TAG#v}"
            echo "pip install apksigcopier"
            echo "apksigcopier compare $apk --unsigned androidApp/build/outputs/apk/release/androidApp-release-unsigned.apk"
            echo "gh attestation verify $apk --repo $GITHUB_REPOSITORY"
            echo '```'
            echo
          } > notes.md

      - name: Attest where the APK was built
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-path: ${{ env.APK }}

      # A release left behind by a run that failed half-way is filled in rather than tripped over.
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" "$APK" "$APK.sha256" --clobber
          else
            gh release create "$TAG" "$APK" "$APK.sha256" --title "$TAG" --notes-file notes.md --generate-notes
          fi
